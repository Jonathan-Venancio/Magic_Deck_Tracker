services:
  backend:
    image: ${DOCKERHUB_USERNAME}/magic-deck-tracker-backend:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: https://magicdecktracker.jonathanvenancio.site
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"

  frontend:
    image: ${DOCKERHUB_USERNAME}/magic-deck-tracker-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend-data:
