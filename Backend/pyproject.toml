[project]
name = "magic-deck-tracker-backend"
version = "0.1.0"
description = "API FastAPI do Magic Deck Tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.17",
    "psycopg[binary] (>=3.2)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
